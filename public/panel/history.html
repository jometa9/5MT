<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5MT — History</title>
<link rel="icon" href="../cube.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; }
  * { -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  body {
    margin: 0; padding: 32px; background: #fff; color: #000;
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  main { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  h1 { margin: 0; font-size: 24px; font-weight: normal; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 img { display: block; }
  h1 a { display: flex; gap: 12px; align-items: center; color: inherit; text-decoration: none; }
  h1 a:hover { text-decoration: underline; }
  #msg { margin: 0; min-height: 1.5em; }
  #msg.err::before { content: "! "; }
  #msg.idle { color: #666; }

  fieldset { border: 1px solid #000; padding: 14px 18px 18px; margin: 0; min-inline-size: 0; min-width: 0; }
  legend { padding: 0 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 4px 8px; border-bottom: 1px solid #000; text-align: left; vertical-align: top; white-space: nowrap; }
  th { font-weight: normal; }
  tr:last-child td { border-bottom: 0; }
  .tableWrap { width: 100%; overflow-x: auto; }

  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filters button[aria-pressed="true"] { background: #000; color: #fff; }

  .empty { margin: 0; color: #666; }
  .statsGrid { display: flex; gap: 20px; flex-wrap: wrap; }
  .statsGrid div { display: flex; flex-direction: column; gap: 2px; min-width: 90px; }
  .statsGrid .label { color: #666; }
  .statsGrid .value { font-size: 15px; }

  input, select, textarea, button {
    font: inherit; color: inherit; background: #fff; border: 1px solid #000; border-radius: 0;
    padding: 3px 8px; margin: 0;
  }
  select { min-width: 220px; max-width: 100%; }
  button { cursor: pointer; }
  button:hover { background: #000; color: #fff; }
  button[aria-pressed="true"]:hover { background: #000; color: #fff; }
  a { color: #000; }
  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    body { padding: 16px; }
    main { gap: 16px; }
    h1 { font-size: 20px; gap: 10px; }
    h1 img { width: 28px; height: 28px; }
    fieldset { padding: 10px 12px 14px; }
    input, select, textarea, button { padding: 6px 10px; }
    legend { row-gap: 6px; }
    .filters { width: 100%; }
    .filters label { flex-basis: 100%; }
    .filters label select { width: 100%; }
    #filterButtons { flex-basis: 100%; }
    #filterButtons button { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<main>

<h1><a href="index.html"><img src="../cube.svg" alt="" width="36" height="36">5MT</a> — History</h1>

<p id="msg" class="idle">Loading history...</p>

<fieldset id="filtersBox">
  <legend>Filters</legend>
  <div class="filters">
    <label><span>Account</span>
      <select id="accountSelect"></select>
    </label>
    <div class="filters" id="filterButtons">
      <button data-filter="today">Today (UTC)</button>
      <button data-filter="month">Current month</button>
      <button data-filter="year">Current year</button>
      <button data-filter="lifetime">Lifetime</button>
    </div>
  </div>
</fieldset>

<fieldset id="statsFieldset">
  <legend>Stats <span id="statsNote" style="color:#666;"></span></legend>
  <div class="statsGrid" id="statsBox">
    <div><span class="label">Total PnL</span><span class="value" id="statTotalPnl">—</span></div>
    <div><span class="label">Winrate</span><span class="value" id="statWinrate">—</span></div>
    <div><span class="label">Max win</span><span class="value" id="statMaxWin">—</span></div>
    <div><span class="label">Max loss</span><span class="value" id="statMaxLoss">—</span></div>
    <div><span class="label">Avg win</span><span class="value" id="statAvgWin">—</span></div>
    <div><span class="label">Avg loss</span><span class="value" id="statAvgLoss">—</span></div>
    <div><span class="label">R</span><span class="value" id="statR">—</span></div>
    <div><span class="label">Trades</span><span class="value" id="statTrades">—</span></div>
  </div>
</fieldset>

<fieldset>
  <legend><span id="resultsTitle">History</span></legend>
  <div class="tableWrap">
  <table id="history">
    <thead>
      <tr id="historyHead"></tr>
    </thead>
    <tbody></tbody>
  </table>
  </div>
  <p id="historyEmpty" class="empty" hidden></p>
</fieldset>

</main>
<script src="mock.js"></script>
<script>
const $ = (id) => document.getElementById(id);

function headers() {
  return { 'content-type': 'application/json' };
}

let msgTimer = null;
function msgIdle() {
  $('msg').textContent = 'Done.';
  $('msg').className = 'idle';
}
function msg(text, ok) {
  clearTimeout(msgTimer);
  $('msg').textContent = (ok ? 'OK: ' : 'ERROR: ') + text;
  $('msg').className = ok ? 'ok' : 'err';
  msgTimer = setTimeout(msgIdle, ok ? 6000 : 15000);
}

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) { location.replace('/login.html'); throw new Error('session expired'); }
  let json = null;
  try { json = await res.json(); } catch {}
  if (!res.ok || !json || !json.success) {
    const err = (json && json.errors && json.errors[0]) || (json && json.message) || ('HTTP ' + res.status);
    throw new Error(err);
  }
  return json.data;
}

const params = new URLSearchParams(location.search);
let currentServer = params.get('server') || '';
let currentAccountId = params.get('accountId') || '';
let currentFilter = params.get('filter') || 'today';
if (!['today', 'month', 'year', 'lifetime'].includes(currentFilter)) currentFilter = 'today';

const ALL_COLS = ['Account', 'Ticket', 'Symbol', 'Type', 'Side', 'Vol', 'Open Price', 'Close Price', 'Open Time (UTC)', 'Close Time (UTC)', 'Profit', 'Swap', 'Commission', 'Net', 'Magic'];
const ACCOUNT_COLS = ALL_COLS.slice(1);

function fmt(n) { return n == null ? '' : Number(n).toFixed(2); }

function fmtTime(unixSeconds) {
  if (!unixSeconds) return '';
  return new Date(unixSeconds * 1000).toISOString().slice(0, 19).replace('T', ' ');
}

function isAllAccounts() { return !currentServer || !currentAccountId; }

const CASH_OP_TYPES = ['deposit', 'withdrawal', 'credit'];
function isCashOp(o) { return CASH_OP_TYPES.includes(o.type); }
function netOf(o) { return o.profit + (o.swap || 0) + (o.commission || 0); }

function computeStats(orders) {
  const nets = orders.filter(o => !isCashOp(o)).map(netOf);
  const wins = nets.filter(n => n > 0);
  const losses = nets.filter(n => n < 0);
  const avgWin = wins.length ? wins.reduce((a, b) => a + b, 0) / wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((a, b) => a + b, 0) / losses.length : 0;
  return {
    trades: nets.length,
    totalPnl: nets.reduce((a, b) => a + b, 0),
    winrate: nets.length ? (wins.length / nets.length) * 100 : 0,
    maxWin: nets.length ? Math.max(...nets, 0) : 0,
    maxLoss: nets.length ? Math.min(...nets, 0) : 0,
    avgWin, avgLoss,
    r: avgLoss !== 0 ? Math.abs(avgWin / avgLoss) : 0,
  };
}

function statSpan(id, text) {
  $(id).textContent = text;
}

function renderStats(orders) {
  const s = computeStats(orders);
  const cashOps = orders.filter(isCashOp).length;
  statSpan('statTotalPnl', fmt(s.totalPnl));
  statSpan('statWinrate', s.trades ? s.winrate.toFixed(1) + '%' : '—');
  statSpan('statMaxWin', fmt(s.maxWin));
  statSpan('statMaxLoss', fmt(s.maxLoss));
  statSpan('statAvgWin', fmt(s.avgWin));
  statSpan('statAvgLoss', fmt(s.avgLoss));
  statSpan('statR', s.r ? s.r.toFixed(2) : '—');
  statSpan('statTrades', String(s.trades));
  $('statsNote').textContent = '— ' + s.trades + ' closed trade(s)' + (cashOps ? ', ' + cashOps + ' deposit/withdrawal/credit entry(ies) excluded' : '');
}

function cell(tr, text) {
  const td = document.createElement('td');
  td.textContent = text;
  tr.appendChild(td);
}

function renderHead() {
  const cols = isAllAccounts() ? ALL_COLS : ACCOUNT_COLS;
  const hr = $('historyHead');
  hr.innerHTML = '';
  for (const c of cols) {
    const th = document.createElement('th');
    th.textContent = c;
    hr.appendChild(th);
  }
}

function orderRow(tb, accountLabel, o) {
  const tr = document.createElement('tr');
  const cells = [];
  if (isAllAccounts()) cells.push(accountLabel);
  cells.push(
    o.ticket, o.symbol, o.type, o.side, fmt(o.volume), fmt(o.open_price), fmt(o.close_price),
    fmtTime(o.open_time), fmtTime(o.close_time), fmt(o.profit), fmt(o.swap), fmt(o.commission),
    fmt(o.profit + (o.swap || 0) + (o.commission || 0)), o.magic || '',
  );
  cells.forEach(c => cell(tr, c));
  tb.appendChild(tr);
}

function updateUrl() {
  const p = new URLSearchParams();
  if (currentServer && currentAccountId) { p.set('server', currentServer); p.set('accountId', currentAccountId); }
  p.set('filter', currentFilter);
  history.replaceState(null, '', location.pathname + '?' + p.toString());
}

function updateFilterButtons() {
  for (const b of $('filterButtons').querySelectorAll('button'))
    b.setAttribute('aria-pressed', b.dataset.filter === currentFilter ? 'true' : 'false');
}

let accountCount = 0;

// Table and stats only make sense with rows; otherwise a plain message replaces them.
function showEmpty(text) {
  const empty = !!text;
  $('history').hidden = empty;
  $('statsFieldset').hidden = empty;
  $('historyEmpty').hidden = !empty;
  $('historyEmpty').textContent = text || '';
}

async function loadHistory() {
  if (!accountCount) {
    $('filtersBox').hidden = true;
    $('resultsTitle').textContent = 'History';
    showEmpty('No accounts yet. Add one from the dashboard to see its history.');
    msgIdle();
    return;
  }
  renderHead();
  updateFilterButtons();
  updateUrl();
  const tb = $('history').querySelector('tbody');
  tb.innerHTML = '';
  msg('loading...', true);
  try {
    if (isAllAccounts()) {
      $('resultsTitle').textContent = 'History — all accounts';
      const accounts = await api('GET', '/api/history?filter=' + currentFilter);
      let total = 0;
      const allOrders = [];
      for (const acc of accounts) {
        const label = acc.account_id + ' ' + acc.server + (acc.status === 'offline' ? ' (offline)' : '');
        if (acc.error) {
          const tr = document.createElement('tr');
          cell(tr, label);
          const td = document.createElement('td');
          td.colSpan = ALL_COLS.length - 1;
          td.textContent = 'error: ' + acc.error;
          tr.appendChild(td);
          tb.appendChild(tr);
          continue;
        }
        for (const o of acc.orders) { orderRow(tb, label, o); allOrders.push(o); total++; }
      }
      renderStats(allOrders);
      showEmpty(tb.rows.length ? '' : 'No closed orders in this period.');
      msg(total + ' closed orders across ' + accounts.length + ' account(s)', true);
    } else {
      $('resultsTitle').textContent = 'History — ' + currentAccountId + ' ' + currentServer;
      const orders = await api('GET', '/api/accounts/' + encodeURIComponent(currentServer) + '/' + encodeURIComponent(currentAccountId) + '/history?filter=' + currentFilter);
      for (const o of orders) orderRow(tb, '', o);
      renderStats(orders);
      showEmpty(orders.length ? '' : 'No closed orders in this period.');
      msg(orders.length + ' closed orders', true);
    }
  } catch (e) {
    renderStats([]);
    showEmpty('Could not load history.');
    msg('could not load history: ' + e.message, false);
  }
}

async function populateAccountSelect() {
  const sel = $('accountSelect');
  sel.innerHTML = '<option value="">All accounts</option>';
  try {
    const accounts = await api('GET', '/api/accounts');
    accountCount = accounts.length;
    for (const a of accounts) {
      const o = document.createElement('option');
      o.value = a.server + '|' + a.account_id;
      o.textContent = a.account_id + ' ' + (a.server_name || a.server);
      if (a.server === currentServer && a.account_id === currentAccountId) o.selected = true;
      sel.appendChild(o);
    }
  } catch (e) {
    msg('could not load accounts: ' + e.message, false);
  }
}

$('accountSelect').onchange = () => {
  const v = $('accountSelect').value;
  if (!v) { currentServer = ''; currentAccountId = ''; }
  else { const [server, accountId] = v.split('|'); currentServer = server; currentAccountId = accountId; }
  loadHistory();
};

for (const b of $('filterButtons').querySelectorAll('button'))
  b.onclick = () => { currentFilter = b.dataset.filter; loadHistory(); };
populateAccountSelect().then(loadHistory);
</script>
</body>
</html>
